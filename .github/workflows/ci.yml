name: CI

on:
  push:
    branches: [main, feature]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run db:push
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run docs:kb-test
      - run: npm run docs:kb-check
      - run: npm run docs:generate
      - run: git diff --exit-code -- ljadoc/kb/generated
